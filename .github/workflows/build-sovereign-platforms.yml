name: Build Sovereign Platforms (Android & Desktop)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build-sovereign-platforms.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Desktop dependencies & Tauri CLI
        run: |
          npm install -g @tauri-apps/cli
          npm --prefix packages/desktop install --no-workspaces --package-lock=false @tauri-apps/cli @tauri-apps/api
          chmod +x packages/desktop/src-tauri/tauri packages/desktop/src-tauri/tauri.js || true

      - name: Setup Android SDK & NDK
        run: |
          ANDROID_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          
          # Find or install stable NDK
          if [ -d "$ANDROID_ROOT/ndk/26.3.11579264" ]; then
            NDK_PATH="$ANDROID_ROOT/ndk/26.3.11579264"
          elif [ -d "$ANDROID_ROOT/ndk" ] && [ "$(ls -A $ANDROID_ROOT/ndk)" ]; then
            NDK_PATH=$(ls -d $ANDROID_ROOT/ndk/* | sort -V | head -n 1)
          else
            echo "Installing NDK 26 via sdkmanager..."
            yes | $ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_ROOT/ndk/26.3.11579264"
          fi
          
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "SDK path: $ANDROID_ROOT"
          echo "NDK path: $NDK_PATH"

      - name: Initialize Android scaffolding
        working-directory: packages/desktop
        run: |
          tauri android init --ci --skip-targets-install

      - name: Build Android APK
        working-directory: packages/desktop
        run: |
          tauri android build --debug --target aarch64

      - name: Collect & Stage APK Binaries
        run: |
          mkdir -p release-apk
          APK_FILE=$(find packages/desktop/src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE"
            cp "$APK_FILE" release-apk/opencode-mobile-android-arm64.apk
            cp "$APK_FILE" release-apk/opencode-mobile-android.apk
          else
            echo "Error: No APK file generated!"
            exit 1
          fi
          ls -la release-apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-apk
          path: release-apk/*.apk

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.0.32-sovereign --repo ${{ github.repository }} || gh release create v2.0.32-sovereign --title "OpenCode Sovereign Edition v2.0.32" --notes "Direct native release binaries" --repo ${{ github.repository }}
          gh release upload v2.0.32-sovereign release-apk/opencode-mobile-android.apk release-apk/opencode-mobile-android-arm64.apk --repo ${{ github.repository }} --clobber

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI globally
        run: npm install -g @tauri-apps/cli

      - name: Build Linux Binary
        working-directory: packages/desktop
        run: |
          tauri build --no-bundle
          mkdir -p release-linux
          if [ -f src-tauri/target/release/opencode-desktop ]; then
            cp src-tauri/target/release/opencode-desktop release-linux/opencode-desktop-linux-x64
          fi
          ls -la release-linux/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64
          path: packages/desktop/release-linux/*

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/desktop
          if [ -d release-linux ] && [ "$(ls -A release-linux)" ]; then
            gh release upload v2.0.32-sovereign release-linux/* --repo ${{ github.repository }} --clobber
          fi

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI globally
        run: npm install -g @tauri-apps/cli

      - name: Build macOS Application
        working-directory: packages/desktop
        run: |
          tauri build --no-bundle
          mkdir -p release-macos
          if [ -f src-tauri/target/release/opencode-desktop ]; then
            cp src-tauri/target/release/opencode-desktop release-macos/opencode-desktop-macos
          fi
          ls -la release-macos/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-macos
          path: packages/desktop/release-macos/*

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/desktop
          if [ -d release-macos ] && [ "$(ls -A release-macos)" ]; then
            gh release upload v2.0.32-sovereign release-macos/* --repo ${{ github.repository }} --clobber
          fi
