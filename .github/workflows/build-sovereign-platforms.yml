name: Build Sovereign Platforms (Android & Desktop)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build-sovereign-platforms.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Signed & Aligned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Desktop dependencies & Tauri CLI
        run: |
          npm install -g @tauri-apps/cli
          npm --prefix packages/desktop install --no-workspaces --package-lock=false @tauri-apps/cli @tauri-apps/api
          chmod +x packages/desktop/src-tauri/tauri packages/desktop/src-tauri/tauri.js || true

      - name: Setup Android SDK & NDK
        run: |
          ANDROID_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          
          # Find or install stable NDK
          if [ -d "$ANDROID_ROOT/ndk/26.3.11579264" ]; then
            NDK_PATH="$ANDROID_ROOT/ndk/26.3.11579264"
          elif [ -d "$ANDROID_ROOT/ndk" ] && [ "$(ls -A $ANDROID_ROOT/ndk)" ]; then
            NDK_PATH=$(ls -d $ANDROID_ROOT/ndk/* | sort -V | head -n 1)
          else
            echo "Installing NDK 26 via sdkmanager..."
            yes | $ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_ROOT/ndk/26.3.11579264"
          fi
          
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "SDK path: $ANDROID_ROOT"
          echo "NDK path: $NDK_PATH"

      - name: Generate Keystore & Setup Signing
        run: |
          keytool -genkey -v -keystore release.keystore -alias opencode -keyalg RSA -keysize 2048 -validity 10000 -storepass opencode123 -keypass opencode123 -dname "CN=AgentAI, OU=Mobile, O=OpenCode, L=Tripoli, S=Tripoli, C=LY"

      - name: Initialize Android scaffolding
        working-directory: packages/desktop
        run: |
          tauri android init --ci --skip-targets-install
          mkdir -p src-tauri/gen/android
          echo "keyAlias=opencode" > src-tauri/gen/android/keystore.properties
          echo "password=opencode123" >> src-tauri/gen/android/keystore.properties
          echo "storePassword=opencode123" >> src-tauri/gen/android/keystore.properties
          echo "keyPassword=opencode123" >> src-tauri/gen/android/keystore.properties
          echo "storeFile=$GITHUB_WORKSPACE/release.keystore" >> src-tauri/gen/android/keystore.properties

      - name: Enforce Android Permissions & Cleartext Traffic
        working-directory: packages/desktop
        run: |
          for m in $(find src-tauri/gen/android -name "AndroidManifest.xml"); do
            echo "Patching AndroidManifest at $m"
            grep -q "android.permission.INTERNET" "$m" || sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>/' "$m"
            grep -q "usesCleartextTraffic" "$m" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$m"
          done

      - name: Build Android APK
        working-directory: packages/desktop
        run: |
          tauri android build --apk --target aarch64 --target armv7

      - name: Align, Sign, and Verify APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          
          mkdir -p release-apk
          RAW_APK=$(find packages/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find packages/desktop/src-tauri/gen/android -type f -name "*.apk" | head -n 1)
          fi
          
          echo "Found raw APK to sign: $RAW_APK"
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          
          ls -lh "$RAW_APK"
          
          # Zipalign 4-byte boundaries (critical for Android 11+ dynamic linker)
          $BUILD_TOOLS_DIR/zipalign -p -f -v 4 "$RAW_APK" /tmp/app-aligned.apk
          
          # Sign with v1, v2, v3 schemes
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:opencode123 --key-pass pass:opencode123 --ks-key-alias opencode --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out release-apk/opencode-mobile-android.apk /tmp/app-aligned.apk
          
          # Verify signatures
          $BUILD_TOOLS_DIR/apksigner verify --verbose release-apk/opencode-mobile-android.apk
          
          # Duplicate arm64 asset for direct download links
          cp release-apk/opencode-mobile-android.apk release-apk/opencode-mobile-android-arm64.apk
          
          echo "Processed APKs in release-apk/:"
          ls -lh release-apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-apk
          path: release-apk/*.apk

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.0.32-sovereign --repo ${{ github.repository }} || gh release create v2.0.32-sovereign --title "OpenCode Sovereign Edition v2.0.32" --notes "Direct native release binaries" --repo ${{ github.repository }}
          gh release upload v2.0.32-sovereign release-apk/opencode-mobile-android.apk release-apk/opencode-mobile-android-arm64.apk --repo ${{ github.repository }} --clobber

  build-windows:
    name: Build Windows x64 Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Desktop dependencies & Tauri CLI
        run: |
          npm install -g @tauri-apps/cli
          npm --prefix packages/desktop install --no-workspaces --package-lock=false @tauri-apps/cli @tauri-apps/api

      - name: Build Windows Executable
        working-directory: packages/desktop
        run: |
          tauri build --no-bundle

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          mkdir release-windows
          $exe = Get-ChildItem -Path packages/desktop/src-tauri/target/release -Filter "opencode-desktop.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination release-windows/opencode-desktop.exe
            Compress-Archive -Path release-windows/opencode-desktop.exe -DestinationPath release-windows/opencode-desktop-windows-x64.zip -Force
            ls release-windows/
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-zip
          path: release-windows/*.zip

      - name: Upload Windows to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view v2.0.32-sovereign --repo ${{ github.repository }} || gh release create v2.0.32-sovereign --title "OpenCode Sovereign Edition v2.0.32" --notes "Direct native release binaries" --repo ${{ github.repository }}
          gh release upload v2.0.32-sovereign release-windows/opencode-desktop-windows-x64.zip --repo ${{ github.repository }} --clobber

